name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: mtc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.0.0"

jobs:
  validate:
    name: Validate monorepo and image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mtc-ci-disposable-only
          POSTGRES_DB: mtc_ci
        ports:
          - 56836:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mtc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6386:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:mtc-ci-disposable-only@127.0.0.1:56836/mtc_ci?schema=public
      REDIS_URL: redis://127.0.0.1:6386
      VUTEQ_SSO_ENABLED: "false"
      API_URL: http://127.0.0.1:31000
      VUTEQ_SSO_BASE_URL: https://sso.vuteq.co.id
      VUTEQ_SSO_PUBLIC_ORIGIN: http://127.0.0.1:31001
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply migrations to disposable database
        run: pnpm db:migrate

      - name: Lint API
        run: pnpm lint:api

      - name: Test API
        run: pnpm test

      - name: Build API
        run: pnpm build:api

      - name: Lint web
        run: pnpm lint:web

      - name: Build web
        run: pnpm build:web

      - name: Build combined mtc-app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mtc-app:ci
          build-args: |
            API_URL=http://api:31000
            VUTEQ_SSO_BASE_URL=https://sso.vuteq.co.id
            VUTEQ_SSO_PUBLIC_ORIGIN=http://localhost:31001
          cache-from: type=gha,scope=mtc-app
          cache-to: type=gha,mode=max,scope=mtc-app
